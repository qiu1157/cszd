server:
  port: 8080

spring:
  application:
    name: charging-station-system
  datasource:
    # 注意：本地开发请先按 code/db/README.md 初始化数据库与账号
    url: jdbc:mysql://localhost:3306/charging_station?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

