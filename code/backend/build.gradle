buildscript {
    repositories {
        // 为什么：当前环境访问 plugins.gradle.org 可能发生 TLS 握手失败；
        // Spring Boot Gradle Plugin 在 Maven Central 可用，因此优先只使用 Maven Central，避免依赖插件门户。
        mavenCentral()
    }
    dependencies {
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.3.2'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.6'
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'com.changsha.zhongdian'
version = '0.0.1-SNAPSHOT'

java {
    // 为什么：Spring Boot 3.3 支持 Java 17+。第一期骨架阶段以 Java 17 为最低基线，
    // 这样本机只要装了任意 JDK 17+（例如 20/21）都能直接编译运行；若没有 JDK，gradlew.bat 会自动下载 JDK 17。
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('test') {
    useJUnitPlatform()
    // 为什么：里程碑 A 进入真实开发后，需要用自动化测试锁定登录与鉴权行为，避免后续权限链路回归。
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// test 配置已在上方统一设置
